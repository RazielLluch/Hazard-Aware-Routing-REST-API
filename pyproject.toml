[project]
name = "hazard-aware-routing-rest-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "osmnx>=2.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "uvicorn>=0.46.0",
]

[tool.pytest.ini_options]
markers = [
    "v2: Macro-DDQN v2 bridge + /api/v2 tests (CI gate: uv run pytest -m v2)",
    "macro: vendored macro-runner bridge tests",
]
